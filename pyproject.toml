[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolset"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Modular Python utility libraries for concurrency, async queues, settings, filesystems, databases, web APIs, agents, CV/OCR, and ML."
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",
    "atomicx>=0.0.15",
    "concurrent-collections>=2.1.0",
    "fsspec>=2026.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.128.0",
    "fastapi-restful>=0.6.0",
    "puremagic>=2.2.0",
    "python-multipart>=0.0.12",
    "uvicorn>=0.40.0",
]
db = [
    "alembic>=1.14.0",
    "postgres>=4.0",
    "psycopg>=3.3.2",
    "psycopg-pool>=3.3.0",
    "pymongo>=4.10.0",
    "sqlalchemy>=2.0.36",
]
azure = [
    "azure-core>=1.39.0",
    "azure-search-documents>=11.6.0",
    "beautifulsoup4>=4.14.3",
    "llama-index-embeddings-azure-openai>=0.5.2",
    "openai>=2.32.0",
    "truststore>=0.10.4",
]
agents = [
    "langchain>=1.2.7",
    "langchain-ollama>=1.0.1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
]
data = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "pillow>=11.0.0",
    "rapidfuzz>=3.14.5",
]
cv = [
    "numpy>=2.4.1",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "pillow>=11.0.0",
    "pypdfium2>=5.3.0",
    "pytesseract>=0.3.13",
]
scraping = [
    "beautifulsoup4>=4.14.3",
    "playwright>=1.60.0",
    "pyautogui>=0.9.54",
]
ml = [
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "peft>=0.14.0",
    "torch>=2.13.0",
    "transformers>=4.48.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-httpserver>=1.1.3",
]
all = [
    "alembic>=1.14.0",
    "azure-core>=1.39.0",
    "azure-search-documents>=11.6.0",
    "beautifulsoup4>=4.14.3",
    "fastapi>=0.128.0",
    "fastapi-restful>=0.6.0",
    "langchain>=1.2.7",
    "langchain-ollama>=1.0.1",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "llama-index-embeddings-azure-openai>=0.5.2",
    "matplotlib>=3.10.8",
    "mlx-lm>=0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "numpy>=2.4.1",
    "openai>=2.32.0",
    "opencv-contrib-python>=4.13.0.92",
    "opencv-python>=4.13.0.92",
    "optuna>=4.7.0",
    "pandas>=3.0.0",
    "peft>=0.14.0",
    "pillow>=11.0.0",
    "playwright>=1.60.0",
    "postgres>=4.0",
    "psycopg>=3.3.2",
    "psycopg-pool>=3.3.0",
    "puremagic>=2.2.0",
    "pyautogui>=0.9.54",
    "pymongo>=4.10.0",
    "pypdfium2>=5.3.0",
    "pytesseract>=0.3.13",
    "pytest>=9.0.2",
    "pytest-httpserver>=1.1.3",
    "python-multipart>=0.0.12",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0.36",
    "torch>=2.13.0",
    "transformers>=4.48.0",
    "truststore>=0.10.4",
    "uvicorn>=0.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py", "*_test.py", "test*.py"]
